[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netsour"
version = "0.2.0"
description = "Live packet capture, protocol analysis and network recon in the terminal"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.9"
authors = [{ name = "thegoodduck" }]
keywords = ["packet", "sniffer", "network", "security", "tui", "scapy", "pcap"]
dependencies = ["scapy>=2.5"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Security",
]

[project.optional-dependencies]
# Active probing. Both the Python binding and the nmap binary must be present.
scan = ["python-nmap"]

[project.urls]
Homepage = "https://github.com/thegoodduck/NetSour"
Issues = "https://github.com/thegoodduck/NetSour/issues"

[project.scripts]
netsour = "netsour.cli:main"

[tool.setuptools.packages.find]
include = ["netsour*"]
